name: pr_checks_tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: pr_checks_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip '.[dev]'

      - name: Run Origo source-native runtime tests
        run: pytest tests/origo_source_native -q --maxfail=1
