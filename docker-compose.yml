services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped


  dagit:
    build: .
    image: trades-warehouse-dagster:latest
    ports:
      - "4000:3000"
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
    volumes:
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagit -h 0.0.0.0 -p 3000
    restart: unless-stopped

  dagster:
    build: .
    image: trades-warehouse-dagster:latest
    environment:
      - DAGSTER_HOME=/opt/app
      - PYTHONPATH=/opt/app
    volumes:
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
    depends_on:
      clickhouse:
        condition: service_healthy
    command: dagster-daemon run
    restart: unless-stopped

  jupyter:
    build: .
    image: trades-warehouse-dagster:latest
    network_mode: "host"
    ports:
      - "9999:8888"
    working_dir: /opt/notebooks
    environment:
      - PYTHONPATH=/opt/app
    volumes:
      - .:/opt/app
      - dagster-instance:/opt/dagster-instance
      - /data/notebooks:/opt/notebooks
      - /data/experiments:/opt/experiments
    depends_on:
      clickhouse:
        condition: service_healthy
    command: /opt/setup-jupyter.sh
    restart: unless-stopped

volumes:
  clickhouse-data:
  dagster-instance:
